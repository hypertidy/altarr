# altarr on R-devel with the proposed ALTREP Extract_array_subset method.
# The patched R comes ready-built from mdsumner/r-variants (the
# array-subset variant), so this only installs altarr and tests it.
on:
  push:
    branches: ['exp/r-hook']
    paths: ['r-patch/**', 'src/**', 'tests/**', 'R/**', '.github/workflows/r-hook.yaml']
  workflow_dispatch:

name: r-hook

permissions: read-all

jobs:
  r-hook:
    runs-on: ubuntu-latest
    container: ghcr.io/mdsumner/r-variants:array-subset
    steps:
      - uses: actions/checkout@v4

      - name: Which R
        run: |
          cat /opt/R/variant/VARIANT.txt
          /opt/R/variant/bin/R --version | head -n1

      - name: Install altarr
        run: /opt/R/variant/bin/R CMD INSTALL .

      - name: Tests and demo on patched R
        run: |
          /opt/R/variant/bin/Rscript -e 'stopifnot(altarr:::has_array_subset())'
          /opt/R/variant/bin/Rscript tests/test-altarr.R
          /opt/R/variant/bin/Rscript r-patch/demo.R
